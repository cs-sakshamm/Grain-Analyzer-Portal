[project]
name = "rice-age-backend"
version = "0.1.0"
description = "Rice Age — IoT rice quality and age analysis portal backend"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI dependencies are evaluated in argument defaults by design

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The CI runner invokes the ``pytest`` console script, which does not add the
# working directory to sys.path. Declaring it here keeps ``import app`` working
# regardless of how pytest is launched.
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
