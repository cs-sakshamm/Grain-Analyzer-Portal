name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rice_age
          POSTGRES_PASSWORD: rice_age
          POSTGRES_DB: rice_age
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rice_age -d rice_age"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://rice_age:rice_age@localhost:5432/rice_age
      RICE_AGE_TEST_DATABASE_URL: postgresql+psycopg://rice_age:rice_age@localhost:5432/rice_age
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Migrations
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Tests
        run: pytest

  device-schema:
    name: Device payload schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install validator
        run: pip install jsonschema
      - name: Meta-validate JSON Schema
        run: |
          python - <<'PY'
          import json
          import jsonschema

          with open("docs/api/device-payload.schema.json", encoding="utf-8") as handle:
              schema = json.load(handle)
          jsonschema.Draft202012Validator.check_schema(schema)
          print("device-payload.schema.json is a valid Draft 2020-12 schema")
          PY

  frontend:
    name: Frontend lint, types, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
