# Development stack for the Rice Age portal: PostgreSQL, FastAPI backend, Vite frontend.
# Usage: cp .env.example .env && docker compose up --build
# Production images use the "production" build targets and are not configured here.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rice_age}
      POSTGRES_USER: ${POSTGRES_USER:-rice_age}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-local-dev-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - rice_age_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rice_age} -d ${POSTGRES_DB:-rice_age}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-dev-only-change-me}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rice_age}:${POSTGRES_PASSWORD:-replace-with-local-dev-password}@db:5432/${POSTGRES_DB:-rice_age}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      STORAGE_BACKEND: local
      STORAGE_LOCAL_ROOT: /srv/app/storage
      MAX_REPORT_BYTES: ${MAX_REPORT_BYTES:-26214400}
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-15728640}
      MAX_SCAN_PAYLOAD_BYTES: ${MAX_SCAN_PAYLOAD_BYTES:-1048576}
      REQUIRED_ATTACHMENT_ROLES: ${REQUIRED_ATTACHMENT_ROLES:-report_pdf,bottom_image}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      PYTHONPATH: /srv/app
    volumes:
      - ./backend:/srv/app
      - rice_age_storage:/srv/app/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  rice_age_pgdata:
  rice_age_storage:
